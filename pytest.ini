[pytest]
# 默认参数：显示详细输出 + 开启 allure 结果收集（每次运行前清空，避免历史结果污染报告）
#           + 保留失败用例的 trace + 默认基准地址
addopts = -v -s --base-url=https://www.qunar.com --tracing=retain-on-failure --alluredir=reports/allure-results --clean-alluredir

# 将项目根目录加入 sys.path，支持 from actions.xxx import ...
pythonpath = .

# 用例目录与命名规则
testpaths = testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 标记
markers =
    smoke: 冒烟测试
    regression: 回归测试
    mock_flight: 通过接口 Mock 跑通航班列表/预订流程（规避反爬空态）
